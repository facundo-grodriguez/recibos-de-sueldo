server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy hacia el backend: VITE_API_URL queda relativo ("/api", ver
    # .env.production) en vez de hornearse absoluto en el build — el mismo
    # bundle sirve para cualquier dominio, sin rebuild por instalación.
    location /api/ {
        proxy_pass http://backend:3000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # La emisión de recibos genera varios PDF con Puppeteer en el mismo
        # request (~530ms/empleado, medido en carga real) — el timeout por
        # defecto (60s) cortaría la emisión de una empresa grande a mitad de
        # camino. 300s da margen sin dejarlo indefinido.
        proxy_read_timeout 300s;
    }

    # SPA: cualquier ruta desconocida cae en index.html (React Router futuro).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
