x-logging: &default-logging
  # Sin esto, un contenedor que loguea sin parar (ej. un bucle de errores)
  # llena el disco del servidor con el tiempo — nunca pasó acá, pero es
  # exactamente el tipo de falla silenciosa que un piloto sin monitoreo
  # activo no detecta a tiempo.
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: recibos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Definí POSTGRES_PASSWORD en tu .env}
      POSTGRES_DB: recibos
    # Sin ports: solo alcanzable desde otros contenedores de este compose
    # (backend), por su nombre de servicio — la base nunca queda expuesta
    # al host ni a Internet. Para inspeccionarla a mano: `docker compose
    # exec postgres psql -U recibos`.
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U recibos']
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *default-logging

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://recibos:${POSTGRES_PASSWORD:?Definí POSTGRES_PASSWORD en tu .env}@postgres:5432/recibos?schema=public
      JWT_SECRET: ${JWT_SECRET:?Definí JWT_SECRET en tu .env}
      JWT_EXPIRES_IN: 8h
    # Sin ports: el único camino de entrada es a través de `frontend` (nginx
    # hace de proxy de /api, ver frontend/nginx.conf) y, delante de todo,
    # `caddy`. Exponer 3000 directo al host duplicaba la superficie de
    # ataque que cierra la Tarea 5 (registro público + rate limiting) sin
    # necesidad — nadie externo debe poder pegarle al backend salteando el
    # proxy.
    volumes:
      # Los PDF emitidos viven en el filesystem del contenedor
      # (FilesystemAlmacenamientoRecibos, `uploads/recibos/`) — sin este
      # volumen, un redeploy o reinicio del contenedor borraría todos los
      # recibos ya emitidos, dejando registros en la base sin su archivo.
      - backend_uploads:/app/uploads
    command: sh -c "npx prisma migrate deploy && node dist/main.js"
    logging: *default-logging

  # Backup diario automático (Tarea 6 del plan de piloto): mismo build que
  # `backend`, pero corre backup-loop.sh en vez de servir HTTP. Ver README,
  # sección "Backups", para el procedimiento de restauración.
  backup:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://recibos:${POSTGRES_PASSWORD:?Definí POSTGRES_PASSWORD en tu .env}@postgres:5432/recibos?schema=public
      # Ninguna de las dos es obligatoria para arrancar: sin RCLONE_REMOTE
      # el backup queda solo local (se avisa en el log, nunca en silencio,
      # ver backup-loop.sh); BACKUP_RETENTION_CANTIDAD tiene default (14) en
      # el propio script.
      RCLONE_REMOTE: ${RCLONE_REMOTE:-}
      BACKUP_RETENTION_CANTIDAD: ${BACKUP_RETENTION_CANTIDAD:-}
    volumes:
      # Mismo volumen que `backend`, pero solo lectura acá: el backup nunca
      # tiene que poder modificar un PDF ya emitido.
      - backend_uploads:/app/uploads:ro
      - backend_backups:/app/backups
      # rclone.conf tiene las credenciales del destino off-site — nunca se
      # sube al repo (ver .gitignore). Copiar de rclone.conf.example antes
      # del primer `up`; si se deja vacío, rclone simplemente no tiene
      # ningún remoto configurado y RCLONE_REMOTE no puede resolver a nada
      # (incluso si se define igual, fallaría — lo cual es correcto: preferible
      # un log de advertencia claro a fingir que copió algo).
      - ./rclone.conf:/root/.config/rclone/rclone.conf:ro
    command: sh scripts/backup-loop.sh
    logging: *default-logging

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    # Sin ports: ya no es el punto de entrada público (lo es `caddy`, que le
    # habla por la red interna del compose). nginx sigue sirviendo el SPA y
    # haciendo de proxy de /api hacia `backend` (ver frontend/nginx.conf).
    logging: *default-logging

  # Único contenedor con puertos publicados al host: entrada pública HTTPS.
  # HTTPS automático (Let's Encrypt) sin certbot ni renovación manual — Caddy
  # lo resuelve solo mientras DOMINIO apunte por DNS a este servidor y los
  # puertos 80/443 estén abiertos hacia afuera (el 80 hace falta para el
  # desafío ACME, no solo para redirigir a HTTPS).
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - frontend
    environment:
      DOMINIO: ${DOMINIO:?Definí DOMINIO (ej. turecibos.duckdns.org) en tu .env}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    logging: *default-logging

volumes:
  postgres_data:
  backend_uploads:
  backend_backups:
  caddy_data:
  caddy_config:
